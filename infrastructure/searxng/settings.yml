use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - bing
      - google
      - wikipedia
general:
  debug: false
  instance_name: Udaan local search
search:
  safe_search: 2
  formats:
    - json
    - html
server:
  secret_key: udaan-local-internal-search-no-public-session
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: wikipedia
    disabled: false
